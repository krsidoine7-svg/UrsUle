<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ursule-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="inner-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#312E81" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded square (squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#ursule-grad)" filter="url(#shadow)" />

  <!-- Subtle grid/pattern ornament -->
  <circle cx="410" cy="110" r="48" fill="#FFFFFF" fill-opacity="0.1" />
  <circle cx="100" cy="410" r="64" fill="#FFFFFF" fill-opacity="0.06" />

  <!-- The stylized 'U' for UrsUle -->
  <g filter="url(#glow)">
    <path d="M 160 140
             L 160 290
             C 160 365 210 405 256 405
             C 302 405 352 365 352 290
             L 352 140
             L 296 140
             L 296 290
             C 296 335 278 352 256 352
             C 234 352 216 335 216 290
             L 216 140
             Z" 
          fill="url(#inner-grad)" />
    <!-- Sparkle accent star -->
    <path d="M 370 110 L 378 130 L 398 138 L 378 146 L 370 166 L 362 146 L 342 138 L 362 130 Z" fill="#FBBF24" />
  </g>
</svg>
